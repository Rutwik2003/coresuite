# ============================================================
#  CoreSuite — Master Configuration
#  by Rocky_Rutwik
# ============================================================

# Enable or disable individual modules.
# Disabled modules are completely unloaded — zero CPU cost.
modules:
  resource-pack: false
  admin: true
  auto-messenger: true
  chat-mentions: true
  clear-lag: true
  world-manager: true
  jump-pad: true
  bank-notes: true
  reward-codes: true
  referral: true
  playtime-rewards: true
  combat-tag: true
  custom-fishing: true
  chat-games: true
  kill-podium: false
  vulcan-punish: true
  creator: true

  # Custom Economy & Gameplay Modules
  orders-board: true
  wishing-well: true
  archaeology-rush: true
  harvest-market: true
  store: true
  announce: true
  gambling: true
  profile: true
  website: true
  world-bosses: true
  guide: true

# Storage settings
storage:
  # Type can be "SQLITE" or "MYSQL"
  type: "SQLITE"
  
  # SQLite settings
  database: "data/coresuite.db"
  
  # MySQL settings
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""

# Debug mode — verbose logging for troubleshooting
debug: false
