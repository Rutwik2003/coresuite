# ============================================================
#  CoreSuite — Player Guide & Onboarding Module Configuration
# ============================================================

enabled: true
prefix: '&8[&6&lGuide&8] &r'

# ── Interactive Guide GUI ──────────────────────────────────
gui:
  title: '&8&lServer Guide &7&l» &eManual & Perks'
  rows: 6
  border-material: GRAY_STAINED_GLASS_PANE

# ── First-Time Join Walkthrough ────────────────────────────
first-join:
  enabled: true
  # Only trigger this walkthrough on a player's very first join to the server (prevents flashing on every join)
  only-first-join: true
  # Number of ticks to wait after player logs in via AuthMe before welcoming them (40 ticks = 2 seconds)
  authme-delay-ticks: 40
  # Plays sound to new player upon first login (leave empty '' to disable)
  sound: 'UI_TOAST_CHALLENGE_COMPLETE'
  # Title and subtitle shown on screen (set title-enabled: false to disable on-screen title flash)
  title-enabled: true
  title: '&6&lWELCOME TO THE SERVER!'
  subtitle: '&eType &b/guide &eto explore features & claim rewards'
  # Formatted chat greeting banner
  welcome-message:
    - '&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - '&6&l  WELCOME TO THE SERVER, %player%!'
    - '&7  We have dozens of unique systems, custom economies,'
    - '&7  and thrilling activities to explore.'
    - ''
    - '&e  ▶ Type &b/guide &eor click below to open your interactive manual:'
    - '&a  [ ✦ CLICK HERE TO OPEN SERVER GUIDE ✦ ]'
    - '&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
  # If true, automatically opens the /guide GUI 3 seconds after first login
  auto-open-gui: false

# ── One-Time Starter Gift ──────────────────────────────────
starter-reward:
  enabled: true
  # Strictly one-time per player via atomic database lock
  one-time-only: true
  # Maximum number of claims allowed per IP address (anti-alt abuse)
  max-claims-per-ip: 1
  # If false, allows existing server players to claim this starter gift once in their lifetime
  require-first-join: false
  # Monetary reward deposited via Vault
  economy-amount: 5000.0
  # Console commands executed upon claim (%player% or {player} is replaced with player name)
  reward-commands:
    - 'crate key give %player% common 1'
    - 'crate key give %player% uncommon 1'
  # Minimum free inventory slots needed before delivering physical crate keys
  required-free-slots: 2
  # Claim button in GUI
  claim-button:
    slot: 49
    unclaimed-material: CHEST
    unclaimed-name: '&a&lClaim Starter Gift &7(One-Time)'
    unclaimed-lore:
      - '&7Click to claim your server starter welcome package:'
      - '  &e• &6$5,000 &7Server Currency'
      - '  &e• &f1x &7Common Crate Key'
      - '  &e• &a1x &7Uncommon Crate Key'
      - ''
      - '&a▶ Click to claim now!'
    claimed-material: MINECART
    claimed-name: '&c&lStarter Gift Claimed'
    claimed-lore:
      - '&7You have already claimed your starter gift.'
      - '&7This reward can only be claimed once per player.'

