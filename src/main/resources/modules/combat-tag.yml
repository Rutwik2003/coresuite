# ============================================================
# CoreSuite - CombatTag Module Configuration
# ============================================================

# Combat duration in seconds
combat-time: 15

# Time in seconds when the timer turns red/urgent
combat-low-threshold: 5

prefix: '&8[&c&lCombat&8] &r'

messages:
  entered-combat: "&c⚔ &lYou entered combat!"
  left-combat: "&a✔ &lYou are no longer in combat!"
  combat-log-broadcast: "&e{player} &7combat-logged while fighting &e{opponent}!"
  command-blocked: "&cYou cannot use commands while in combat! &7({time}s remaining)"
  combat-action-bar: "&c&l⚔ Combat: &4&l{time}s"
  low-health-warning: "&cLow health!"

blocked-commands:
  - "home"
  - "spawn"
  - "tpa"
  - "tpaccept"
  - "tpahere"
  - "tpdeny"
  - "warp"
  - "warps"
  - "hub"
  - "lobby"
  - "back"
  - "wild"
  - "rtp"
  - "is"
  - "island"
  - "clan"
  - "f"
  - "town"
  - "ehome"
  - "espawn"
  - "etpa"
  - "etpaccept"
  - "ewarp"
  - "eback"

sounds:
  enter-sound: "ENTITY_PLAYER_ATTACK_CRIT"
  exit-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
