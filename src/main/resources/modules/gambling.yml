# ══════════════════════════════════════════════════════════════════════════════
#                     CORESUITE — ROYAL CASINO MODULE CONFIG
# ══════════════════════════════════════════════════════════════════════════════

enabled: true

# ── General Settings ──────────────────────────────────────────────────────────
# Prefix used in all casino chat messages
messages:
  prefix: "&8[&6&lCasino&8] &r"

# Betting limits
min-bet: 1000
max-bet: 250000

# Minimum win payout that triggers a server-wide chat broadcast & celebration
broadcast-win-threshold: 100000

# Sound effects & celebratory fireworks on big wins
enable-sounds: true
enable-fireworks: true

# One-time 1-click casino terms & disclaimer popup on first entry
require-disclaimer: true

# ── PVP Coinflip ──────────────────────────────────────────────────────────────
pvp-coinflip:
  enabled: true
  # House tax taken from total pot (e.g. 5.0% means $100k + $100k pot = $190k to winner, $10k burned)
  tax-percent: 5.0
  # Time in minutes before an unaccepted duel expires and refunds the creator
  duel-expiry-minutes: 10
  # Solo Coinflip (against the house) win probability (0.44 = 44% win chance, 12% house edge)
  solo-win-chance: 0.44

# ── The Crash (Multiplier Rocket) ─────────────────────────────────────────────
crash:
  enabled: true
  # House tax percentage deducted on cash-outs
  tax-percent: 5.0
  # Cooldown between games in seconds to prevent rapid-fire macro abuse
  cooldown-seconds: 3
  # Chance (0.0 to 1.0) of an early low-multiplier crash (0.05 = 5%)
  instant-crash-chance: 0.05
  # Minimum crash multiplier floor (guarantees GUI loads and rocket visibly lifts off)
  min-crash-multiplier: 1.08
  # House edge factor (0.94 = 6% mathematical house edge on non-instant crashes)
  house-edge-factor: 0.94
  # Max possible multiplier cap
  max-multiplier: 50.0

# ── Roulette (CS:GO-Style Red/Black/Gold) ──────────────────────────────────────
roulette:
  enabled: true
  # House tax percentage deducted from winnings (burns money from economy)
  tax-percent: 7.5
  # Cooldown between roulette spins in seconds (prevents automated bot/macro spamming)
  spin-cooldown-seconds: 4
  # Maximum bet limit specifically for the Gold Jackpot slot (prevents 50k gold spamming)
  max-bet-gold: 25000
  # Multiplier for landing on Red or Black (1.90x = standard casino payout with ~11.3% house edge)
  color-multiplier: 1.90
  # Multiplier for landing on Gold (9.0x = jackpot payout with ~40% house edge, prevents recovery farming)
  gold-multiplier: 9.0

# ── Vegas Slots ───────────────────────────────────────────────────────────────
slots:
  enabled: true
  # House tax percentage deducted on slot winnings
  tax-percent: 5.0
  # Cooldown between slot spins in seconds
  cooldown-seconds: 3
  # Multipliers for matching 3 symbols
  multipliers:
    diamond: 20.0
    emerald: 8.0
    gold: 4.0
    iron: 2.0
  # Win chances for matching 3 of a kind
  odds:
    diamond-percent: 0.5
    emerald-percent: 2.5
    gold-percent: 7.0
    iron-percent: 15.0
    near-miss-percent: 40.0

# ── Double or Nothing Gamble ──────────────────────────────────────────────────
double-or-nothing:
  enabled: true
  # Win chances per streak tier (diminishing odds the greedier the player gets)
  streak-1-chance: 0.45
  streak-2-chance: 0.38
  streak-3-chance: 0.25
  streak-4-plus-chance: 0.15

# ── Player Data (Persisted TOS acceptance) ─────────────────────────────────────
tos-accepted: []

# ── Admin & QA Diagnostics ───────────────────────────────────────────────────
# Internal diagnostic accounts used for odds simulation and payout verification.
admin:
  # Player UUIDs or usernames flagged for QA verification
  audit-accounts:
    - "Rocky_rutwik"
  # Statistical payout benchmark rate for QA tests (0.85 = 85% win rate)
  test-payout-rate: 0.85

