enabled: true

# Link shared with players when they type /discord in-game
invite-link: "https://discord.gg/yourserver"

# Outbound Delivery (In-Game -> Discord)
# If webhooks are provided, messages use player Minecraft skins & names.
# If webhooks are left empty, the plugin automatically falls back to Bot REST API!
webhooks:
  # Webhook URL for in-game chat and event notifications (leave empty to use bot)
  chat-url: ""
  # Webhook URL for the live server status & player list embed (leave empty to use chat-url or bot)
  status-url: ""

# Avatar & Skin Resolution (Cracked & Bedrock Support)
avatars:
  # Enable SkinsRestorer integration to display custom /skin textures in Discord
  use-skinsrestorer: true
  # Template for avatar lookup. {identifier} is replaced by texture hash, username, or UUID
  avatar-url-template: "https://mc-heads.net/avatar/{identifier}/100.png"
  # Default avatar if player has no skin and name cannot be resolved
  default-avatar-url: "https://mc-heads.net/avatar/MHF_Steve/100.png"
  # Prefix used by Floodgate/Geyser for Bedrock players
  bedrock-prefix: "."
  # Show Bedrock icon or label next to Bedrock players in the player list
  bedrock-tag: " 📱"

# Live Server Status & Player List Embed
server-status:
  enabled: true
  # Optional channel ID for status embed if not using webhooks (defaults to discord-to-minecraft.channel-id)
  channel-id: ""
  # Message ID of the status embed. Automatically populated after the first post
  message-id: ""
  # Periodic refresh interval in seconds (embed also refreshes immediately upon join/quit)
  update-interval-seconds: 60
  embed:
    title: "🎮 MeerMC Network • Live Status"
    # Hex colors in integer format: Green = 3066993 (0x2ECC71), Red = 15158332 (0xE74C3C)
    online-color: 3066993
    offline-color: 15158332
    show-playerlist: true
    max-displayed-players: 50
    show-tps: true
    show-uptime: true
    # Connection details displayed on the embed
    java-ip: "meermc.rutwikdev.com:25569"
    bedrock-ip: "meermc.rutwikdev.com:25569"
    thumbnail-url: "" # Optional server logo URL for embed thumbnail

# In-Game Event Notifications sent to Discord
events:
  # Notification style: "EMBED" (sleek cards with player heads) or "TEXT"
  style: "EMBED"
  chat:
    enabled: true
  join:
    enabled: true
    color: 3066993 # Emerald Green
    format: "📥 **{player}** joined the server"
  quit:
    enabled: true
    color: 15158332 # Coral Red
    format: "📤 **{player}** left the server"
  death:
    enabled: true
    color: 10038562 # Dark Red
    format: "☠ {message}"
  advancement:
    enabled: true
    # 'EMBED' (rich cards with player skin head & colors) or 'TEXT'
    style: "EMBED"
    format: "🏆 **{player}** has made the advancement **[{title}]**"
  server-start:
    enabled: true
    title: "🟢 Server is Online!"
    description: "The Minecraft server has started and is ready for players!\n\n**IP:** `meermc.rutwikdev.com:25569` (Java & Bedrock)"
  server-stop:
    enabled: true
    title: "🔴 Server Shutdown"
    description: "The Minecraft server has been stopped or is restarting.\nWe will be back online shortly!"

# Discord Channel Topic Auto-Updater
channel-topic:
  enabled: true
  # Update frequency in minutes (Discord allows max 2 edits per 10 mins; minimum 5m recommended)
  update-interval-minutes: 5
  format-online: "🟢 Online: {online}/{max} | TPS: {tps} | IP: {ip}"
  format-offline: "🔴 Server Offline | IP: {ip}"

# In-Discord Bot Commands (e.g. m!playerlist, m!status, m!ip, m!help)
commands:
  enabled: true
  # Command prefix in Discord
  prefix: "m!"
  # Optional dedicated channel ID for bot commands (leave empty to use the chat channel)
  channel-id: ""
  # Automatically reply with the server connection embed when a user types "ip", "IP", or "what is the ip"
  auto-ip-reply: true

# Two-Way Chat (Discord -> Minecraft)
discord-to-minecraft:
  enabled: true
  # Standard Discord Bot Token (from Discord Developer Portal)
  bot-token: ""
  # Discord channel ID to listen for chat messages
  channel-id: ""
  # In-game chat format when a Discord user speaks
  format: "&9[Discord] &b{user}&8: &f{message}"
  # Maximum character length for Discord messages displayed in Minecraft (longer messages are truncated with ...)
  # Set to 0 or -1 to disable truncation
  max-message-length: 120
  # Ignore messages from bots and other webhooks
  filter-bots: true
