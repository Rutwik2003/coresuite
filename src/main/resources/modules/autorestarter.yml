enabled: true

# Time schedule in IST (Asia/Kolkata)
# Replicates UAR Format: Day;HH;mm or Daily;HH;mm
restarts:
  - "Daily;00;00"
  - "Daily;12;00"

# Broadcast intervals in seconds
intervals:
  - 1800
  - 900
  - 600
  - 300
  - 180
  - 60
  - 15
  - 5
  - 4
  - 3
  - 2
  - 1

# Delay restarts if server is highly populated (UAR feature)
delay:
  trigger-at: 60
  if-players-more-than: 50
  delay-by: 300 # seconds

commands:
  - "save-all"
  - "say Restarting..."

messages:
  broadcast: "&c&l[!] &cServer will restart in &e{time}&c!"
  restarting: "&c&l[!] &cServer is restarting NOW!"
  kick: "&cServer is restarting!\n&ePlease rejoin in a few minutes."
  delayed: "&e&l[!] &eRestart delayed by 5 minutes due to high player count ({players})!"

sounds:
  enabled: true
  type: "BLOCK_NOTE_BLOCK_PLING"

titles:
  enabled: true
  title: "&c&lSERVER RESTART"
  subtitle: "&eRestarting in {time}"
