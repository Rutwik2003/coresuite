# ============================================================
# CoreSuite Fishing-RPG Module Configuration
# A complete RPG fishing experience with skill trees,
# biome ecosystems, dynamic events, and secret quests.
# ============================================================
config-version: 1
prefix: '&8[&b&lFishing&8] &r'

# ============================================================
# CORE SETTINGS
# ============================================================
settings:
  # Whether to override vanilla fishing drops entirely
  override-vanilla-fishing: true
  # Open water requirement (vanilla mechanic — 5x5 water)
  require-open-water: true
  # Junk catch base chance (reduced by Fishing Power)
  junk-chance: 0.15
  # Vanilla treasure base chance (boosted by Fishing Luck)
  treasure-chance: 0.05

# ============================================================
# COMBO SYSTEM
# ============================================================
combo:
  # Time window (ms) after bobber splash for a Perfect Catch
  perfect-window-ms: 300
  # Time window (ms) for a Good catch
  good-window-ms: 800
  # Max combo multiplier cap
  max-multiplier: 5.0
  # Multiplier gain per combo step
  per-combo-bonus: 0.1
  # Seconds of inactivity before combo resets
  timeout-seconds: 15

# ============================================================
# LEVELING & XP
# ============================================================
leveling:
  # Base XP per normal catch
  xp-per-catch: 5
  # Bonus XP per rarity tier above Common
  xp-rarity-bonus: 10
  # XP formula: required XP = level * level * this multiplier
  xp-formula-multiplier: 100
  # XP bonus for Perfect Catch
  perfect-catch-xp-bonus: 10
  # XP bonus for first discovery of a species
  discovery-xp-bonus: 50

# ============================================================
# FATIGUE SYSTEM
# ============================================================
fatigue:
  # Minutes to fully recover from 100 to 0
  recovery-time-minutes: 60
  # Fatigue threshold where penalties start
  threshold: 75
  # Message shown when fatigued
  message: '&c&oYour arms are getting tired...'

# ============================================================
# SKILL TREE
# ============================================================
skill-tree:
  # Path of the Hunter — boosts Fishing Power (rarity chance)
  hunter:
    max-points: 20
    per-point-fishing-power: 0.05
    description: 'Increases your chance of catching rarer fish.'
  # Path of the Scavenger — boosts Fishing Luck (treasure + compass)
  scavenger:
    max-points: 20
    per-point-fishing-luck: 0.05
    description: 'Increases your chance of finding treasures and rare items.'
  # Path of the Mystic — reduces bait consumption, boosts rod durability
  mystic:
    max-points: 20
    per-point-bait-saver: 0.05
    description: 'Reduces bait consumption and unlocks supernatural catches.'

# ============================================================
# ROD TIERS
# ============================================================
rod-tiers:
  bronze:
    display-name: '&6Bronze'
    enchant-multiplier: 1.15
    requirements:
      level: 5
      fish:
        anchovy: 10
        bluegill: 10
      materials:
        IRON_INGOT: 5
  silver:
    display-name: '&fSilver'
    enchant-multiplier: 1.30
    requirements:
      level: 15
      fish:
        char: 5
        cherry_salmon: 5
      materials:
        IRON_INGOT: 15
        PRISMARINE_SHARD: 10
  gold:
    display-name: '&eGold'
    enchant-multiplier: 1.50
    requirements:
      level: 30
      fish:
        golden_carp: 3
        arowana: 5
      materials:
        GOLD_INGOT: 20
        HEART_OF_THE_SEA: 1
  diamond:
    display-name: '&bDiamond'
    enchant-multiplier: 1.75
    requirements:
      level: 50
      fish:
        coelacanth: 2
        blue_marlin: 3
      materials:
        DIAMOND: 15
        NAUTILUS_SHELL: 5
  netherite:
    display-name: '&4Netherite'
    enchant-multiplier: 2.0
    requirements:
      level: 75
      fish:
        lava_particle: 1
        magma_ray: 2
      materials:
        NETHERITE_INGOT: 3
        NETHER_STAR: 1

# ============================================================
# CUSTOM ENCHANTMENTS
# ============================================================
enchants:
  lure_of_the_deep:
    name: 'Lure of the Deep'
    description: 'Increases rarity chance per level.'
    max-level: 3
    rune-material: LAPIS_LAZULI
    requirements:
      level: 10
      fish-count: 50
  heavyweight:
    name: 'Heavyweight'
    description: 'Increases weight of caught fish.'
    max-level: 5
    rune-material: ANVIL
    requirements:
      level: 15
      fish-count: 100
  double_hook:
    name: 'Double Hook'
    description: 'Chance to catch two fish at once.'
    max-level: 3
    rune-material: TRIPWIRE_HOOK
    requirements:
      level: 20
      fish-count: 150
  treasure_hunter:
    name: 'Treasure Hunter'
    description: 'Increases vanilla treasure chance.'
    max-level: 3
    rune-material: EMERALD
    requirements:
      level: 25
      fish-count: 200
  tireless_caster:
    name: 'Tireless Caster'
    description: 'Reduces fatigue gain per catch.'
    max-level: 3
    rune-material: PHANTOM_MEMBRANE
    requirements:
      level: 30
      fish-count: 250

# ============================================================
# BAITS
# ============================================================
baits:
  worm:
    name: '&aWorm Bait'
    material: SLIME_BALL
    item-model: 'barely_default:bait_worm'
    lore:
      - '&7A common bait for casual fishing.'
      - '&7+10% Catch Chance for 30 casts.'
    price: 500
    daily-limit: 10
    type: casts
    casts: 30
    catch-chance-bonus: 0.10
    weight-bonus: 0.0
    rarity-bias: ''
  golden_lure:
    name: '&6Golden Lure'
    material: GOLD_NUGGET
    item-model: 'barely_default:bait_golden_lure'
    lore:
      - '&7A shimmering golden lure.'
      - '&7+15% Catch Chance, +10% Weight for 25 casts.'
    price: 2500
    daily-limit: 5
    type: casts
    casts: 25
    catch-chance-bonus: 0.15
    weight-bonus: 0.10
    rarity-bias: ''
  tide_essence:
    name: '&bTide Essence'
    material: HEART_OF_THE_SEA
    item-model: 'barely_default:bait_tide_essence'
    lore:
      - '&7Concentrated ocean magic.'
      - '&7+20% Catch Chance, biases Epic+ for 20 casts.'
    price: 10000
    daily-limit: 3
    type: casts
    casts: 20
    catch-chance-bonus: 0.20
    weight-bonus: 0.05
    rarity-bias: 'EPIC'
  mythic_chum:
    name: '&d&lMythic Chum'
    material: FERMENTED_SPIDER_EYE
    item-model: 'barely_default:bait_mythic_chum'
    lore:
      - '&7Ancient fish blood mixed with stardust.'
      - '&7+30% Catch Chance, biases Legendary+ for 15 casts.'
    price: 50000
    daily-limit: 1
    type: casts
    casts: 15
    catch-chance-bonus: 0.30
    weight-bonus: 0.15
    rarity-bias: 'LEGENDARY'

bait-shop:
  force-restock-price: 100000

# ============================================================
# FISH BAG
# ============================================================
bag-pages:
  '2':
    price: 5000
    level-required: 5
  '3':
    price: 15000
    level-required: 10
  '4':
    price: 30000
    level-required: 20
  '5':
    price: 50000
    level-required: 30
  '6':
    price: 75000
    level-required: 40
  '7':
    price: 100000
    level-required: 50
  '8':
    price: 150000
    level-required: 60
  '9':
    price: 200000
    level-required: 70
  '10':
    price: 300000
    level-required: 80

# ============================================================
# GLOBAL HOTSPOTS
# ============================================================
hotspot:
  enabled: true
  # Minutes between automatic hotspot spawns
  interval-minutes: 90
  # Duration of a hotspot in minutes
  duration-minutes: 15
  # Minimum online players to trigger
  min-players: 3
  # Radius around the hotspot center
  radius: 10.0
  # Catch rate multiplier inside hotspot
  catch-multiplier: 2.0
  # Weight multiplier inside hotspot
  weight-multiplier: 1.5
  # Search radius from world spawn for placement
  spawn-radius: 5000

# ============================================================
# SEA MONSTERS
# ============================================================
sea-monsters:
  enabled: true
  # Base chance to hook a corrupted fish (per catch)
  corrupted-chance: 0.01
  # Chance multiplier during thunderstorms
  thunderstorm-multiplier: 3.0
  # Chance to trigger a world boss from hotspot fishing
  boss-chance-hotspot: 0.005
  # Boss mob type (ELDER_GUARDIAN, WARDEN, etc.)
  boss-type: ELDER_GUARDIAN
  # Boss health multiplier
  boss-health-multiplier: 2.0
  # Boss rewards
  boss-rewards:
    money: 100000
    xp-levels: 30
    commands:
      - 'crate givekey %player% legendary 3'

# ============================================================
# WEEKLY TOURNAMENT
# ============================================================
tournament:
  enabled: true
  reset-day: MONDAY
  reset-hour: 0
  min-participants: 3
  prizes:
    1st: 500000
    2nd: 250000
    3rd: 100000
  prize-commands:
    1st: 'crate givekey %player% legendary 5'
    2nd: 'crate givekey %player% legendary 3'
    3rd: 'crate givekey %player% legendary 1'

# ============================================================
# DAILY BOUNTY
# ============================================================
daily-bounty:
  enabled: true
  # Number of bounty targets per day
  target-count: 3
  # Reward per bounty fish turned in
  reward-per-fish: 5000
  # Bonus XP per bounty fish
  bonus-xp: 25

# ============================================================
# LEGENDARY POND EVENT
# ============================================================
pond-event:
  enabled: true
  interval-minutes: 30
  forming-minutes: 5
  duration-minutes: 10
  min-players: 2
  spawn-radius: 8000
  radius: 5.0
  reward-multiplier: 2.0
  weight-multiplier: 2.0
  fatigue-heal-amount: 5.0
  forming-sound: BLOCK_NOTE_BLOCK_CHIME
  start-sound: UI_TOAST_CHALLENGE_COMPLETE
  enter-message: '&a✦ You entered the Legendary Fishing Pond! Cast your rod here for bonus rewards!'
  leave-message: '&7✦ You left the Legendary Fishing Pond area.'

# ============================================================
# ANCIENT ANGLER SECRET QUEST
# ============================================================
legendary-quest:
  # Base chance per catch to receive the compass
  map-drop-chance: 0.00002
  # Pity system: guaranteed drop after this many catches
  pity-threshold: 2500
  # Compass tracking distance within world
  compass-range-blocks: 5000
  # NPC Citizens skin data
  npc-skin: 'Fisherman'
  npc-skin-value: ''
  npc-skin-signature: ''
  # NPC despawn conditions
  npc-max-distance-blocks: 50
  npc-idle-timeout-seconds: 300
  # Rewards for safe paths
  safe-rewards:
    secret-enchant:
      enchant-id: 'tireless_caster'
      levels-per-reward: 1
    sunken-hoard:
      money: 500000
    wisdom-of-deep:
      fishing-xp: 500
      vanilla-xp-levels: 30
    masters-tackle:
      baits:
        - 'mythic_chum:3'
        - 'tide_essence:5'
        - 'golden_lure:10'
    leviathans-catch:
      guaranteed-rarity: 'MYTHICAL'
  # Penalties for unsafe paths
  unsafe-penalties:
    money-drain:
      amount: 25000
    fish-destruction:
      count: 5
    blindness:
      duration-seconds: 10
    mining-fatigue:
      duration-seconds: 30
    mob-spawn:
      type: DROWNED
      count: 3

# ============================================================
# GUIDE BOOK
# ============================================================
guide-book:
  title: '&6&lAngler''s Guidebook'
  author: 'The Harbor Master'
  pages:
    - |
      &0&l--- Welcome ---
      &0Welcome to the world of
      &0fishing, adventurer!

      &0This guide will teach you
      &0everything you need to
      &0know about the Angler's
      &0Journey.

      &0Use /fish to get started.
    - |
      &0&l--- Rarity Tiers ---
      &7Common &0(45%)
      &aUncommon &0(30%)
      &9Rare &0(15%)
      &5Epic &0(8%)
      &6Legendary &0(1.9%)
      &dMythical &0(0.1%)

      &0Your Fishing Power stat
      &0shifts these chances in
      &0your favor!
    - |
      &0&l--- Combo System ---
      &0React quickly when the
      &0bobber splashes!

      &a⚡ Perfect &0(< 0.3s)
      &0 Builds combo multiplier

      &eGood &0(< 0.8s)
      &0 Maintains combo

      &7Normal / &cSlow
      &0 Resets combo to 0
    - |
      &0&l--- Skill Tree ---
      &0Earn Skill Points by
      &0leveling up. Spend in
      &0/fish skills on 3 paths:

      &c⚔ Hunter
      &0 +Fishing Power (rarity)

      &e☘ Scavenger
      &0 +Fishing Luck (treasure)

      &d✨ Mystic
      &0 +Bait Saver, rod durability
    - |
      &0&l--- Rod Tiers ---
      &7Basic &0> &6Bronze &0>
      &fSilver &0> &eGold &0>
      &bDiamond &0> &4Netherite

      &0Upgrade by completing
      &0quests from the Harbor
      &0Master NPC. You need
      &0specific fish & materials.

      &0Higher tiers multiply
      &0all enchant effects!
    - |
      &0&l--- Baits ---
      &0Right-click a bait item
      &0to activate it. Buffs
      &0last for a set number
      &0of casts.

      &aWorm &0- Basic boost
      &6Golden Lure &0- Weight+
      &bTide Essence &0- Epic bias
      &dMythic Chum &0- Legendary!
    - |
      &0&l--- Sea Monsters ---
      &0Sometimes fishing hooks
      &0something dangerous!

      &4Corrupted Fish &0can be
      &0purified at the Guild.

      &4World Bosses &0may spawn
      &0during storms or at
      &0hotspots. Defeat them
      &0for legendary loot!


      &0An impossibly rare compass
      &0may appear in your catch.
      &0Follow it to summon the
      &0Ancient Angler.

      &0Choose your words wisely.
      &0Safe paths grant power.
      &0Dangerous paths punish.

      &8&oGood luck, adventurer.

# ============================================================
# COMPENSATION / UPDATE KIT
# ============================================================
update-kit:
  enabled: true
  items:
    - material: FISHING_ROD
      name: '&7Basic Angler Rod'
      lore:
        - '&7A fresh start on the waters.'
    - material: SLIME_BALL
      name: '&aWorm Bait'
      amount: 15
      bait-id: 'worm'
  money: 25000
  lore-note:
    material: PAPER
    name: '&e&lNotice from the Harbor Master'
    lore:
      - '&7Dear Angler,'
      - '&7The seas have changed. Your old'
      - '&7gear no longer works in these waters.'
      - '&7Please accept this starter kit as'
      - '&7compensation. The new journey awaits!'
      - ''
      - '&8— The Harbor Master'

# ============================================================
# MESSAGES
# ============================================================
messages:
  catch: '&7You caught {rarity_color}{name} &7({weight} kg) — &e${price}'
  perfect-catch: '&a⚡ Perfect Catch! &7Combo: &bx{combo}'
  good-catch: '&e✓ Good! &7Combo maintained: &bx{combo}'
  combo-reset: '&c✗ Combo reset!'
  junk-catch: '&7You fished up some junk...'
  treasure-catch: '&6★ Treasure! &fYou found {item}!'
  corrupted-catch: '&4☠ Corrupted Catch! &7A dark fish writhes on your line...'
  level-up: '&a&l⬆ LEVEL UP! &7You are now Angler Level &b{level}&7! &e+1 Skill Point'
  discovery: '&d✦ New Discovery! &7You''ve found a new species: {rarity_color}{name}'
  fatigue-warning: '&c&oYour arms are getting tired... catch quality is decreasing.'
  boss-spawn: '&4&l⚠ A SEA MONSTER has been hooked! &cDefeat it for legendary rewards!'
  hotspot-announce: '&b&l✦ FISHING HOTSPOT! &eA school of rare fish spotted near &b{x}, {z}&e! ({duration}min)'
  bounty-announce: '&6&l☆ DAILY BOUNTY: &eCatch &b{fish_name} &efor bonus rewards today!'

