      poison-duration: 3
    rootling-ghouls:
      max-health: 35.0
      movement-speed: 0.32
      spawn-interval-seconds: 25
      spawn-count: 2
      max-active: 5
    strangling-brambles:
      cooldown-seconds: 14
      damage: 14.0
      cage-duration-seconds: 4
