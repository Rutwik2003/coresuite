# ==============================================================================
#                      CORE SUITE - WORLD BOSSES MODULE
# ==============================================================================
# Fully configurable MMORPG World Boss system inspired by Shangri-La Frontier.
# Supports Paper 1.21+ Java & Bedrock Crossplay.

enabled: true
config-version: 2
# Optional named arenas. With entries present, scheduled encounters use these locations.
# Manage locations using /bossadmin arena add <name> and /bossadmin arena remove <name>.
arenas: {}
prefix: "&8[&4&lBoss&8] &r"

# =========================================================================
#  ARENA & PORTAL SYSTEM
# =========================================================================
arena:
  # Fixed boss spawn location (boss always spawns here)
  fixed-location:
    enabled: true
    world: "world"
    x: 49662.0
    y: 205.0
    z: 49528.0

  # Dedicated player spawn points inside the arena (randomly selected on entry)
  player-spawns:
    - x: 49610.5
      y: 205.0
      z: 49528.5
    - x: 49718.5
      y: 205.0
      z: 49528.5

  # Temporary godmode immunity upon teleporting into the arena (prevents TP-killing)
  spawn-protection-seconds: 15

  # Entrance portal settings
  portals:
    enabled: true
    count: 3                          # Number of entrance portals to spawn
    search-radius: 8000              # Max distance from world spawn for portal placement
    min-portal-distance: 250         # Minimum distance between portals
    # After opening: 15 minutes for first entry, then existing entrants only.
    # Bosses retreat without rewards after 30 minutes without player combat.
    forming-minutes: 8               # Minutes before portals become active
    entry-fee: 50000.0               # Economy cost to enter (0 = free)
    allow-free-reentry: true         # Players who paid can re-enter for free if they die
    interact-radius: 3.5             # Step-in radius to enter portal
    detect-radius: 6.0               # Actionbar notification radius
    search-attempts: 50              # Max async location search attempts per portal
    # RIFT_FORMING is a layered magical cue; custom pack keys such as coresuite:rift.forming also work.
    forming-sound: "RIFT_FORMING"
    # Nearby rift prompt: quiet beacon hum and amethyst chime, without Nether portal whooshes.
    # Accepts a Bukkit sound name or custom resource-pack key; empty string disables it.
    ambient-sound: "RIFT_AMBIENT"
    start-sound: "UI_TOAST_CHALLENGE_COMPLETE"
    entry-sound: "ENTITY_ENDERMAN_TELEPORT"
    exit-sound: "ENTITY_ENDERMAN_TELEPORT"
    deny-sound: "ENTITY_VILLAGER_NO"
    forming-broadcast: "&5&l⚔ &d Dark rifts are tearing open across the world... Boss portals forming!"
    active-broadcast: "&5&l⚔ &d The Arena Rifts have opened! Find a portal to enter the battle!"
    portal-location-format: "&8 → &7Portal at &e{x}&7, &e{z} &8(&7{distance}m away&8)"
    enter-prompt: "&d&l⚡ &fStep into the rift to enter the Boss Arena &8(&e${fee}&8)"
    reentry-prompt: "&d&l⚡ &fStep into the rift to re-enter the Boss Arena &8(&aFREE&8)"
    enter-success: "&a&l✦ &fYou have entered the arena! &8$50,000 charged."
    reentry-message: "&a&l✦ &fWelcome back to the arena! &8(No charge — already paid)"
    insufficient-funds: "&c&l✘ &fYou need &e${fee} &fto enter the Boss Arena! &8(Balance: &e${balance}&8)"
    exit-prompt: "&a&l✦ &fStep into the light to return to where you came from!"
    exit-success: "&a&l✦ &fYou have been returned to your entrance location."

  # Exit portal settings (post-defeat)
  exit-portal:
    spawn-delay-seconds: 5           # Delay after boss death before exit appears
    radius: 2.5                      # Interaction radius for exit

# ------------------------------------------------------------------------------
# Arena & Domain Boundaries
# ------------------------------------------------------------------------------
domain:
  # Music and atmosphere extend this many blocks beyond the fixed arena.
  # Existing listeners have a further 4-block exit buffer to prevent edge flicker.
  spectator-distance: 16.0
  # The radius of the visual combat domain in blocks
  radius: 35.0
  # If boss is pulled beyond this distance from its spawn point, it leashes back
  leash-distance: 50.0
  # Protect blocks in the domain from breaking/placing during combat
  # False also skips region spawn preflight at arena.fixed-location only.
  # Terrain/world-border checks, wilderness spawns and temporary-block protection remain active.
  anti-grief-protection: true
  # Visual boundary particles (displayed along the ground perimeter)
  boundary-particle: "FLAME"
  # Cinematic Adventure BossBar atmosphere flags
  darken-screen: true
  create-world-fog: true
  # Background music volume (0.0 to 1.0, default 0.85 cuts clearly through storm/rain)
  bgm-volume: 0.85
  # Sound channel category for BGM (RECORDS, MUSIC, MASTER, etc.)
  bgm-category: "RECORDS"
  # Victory fanfare volume upon boss defeat (0.0 to 1.0)
  victory-volume: 0.50
  # Victory fanfare duration before automatic fadeout/silence (seconds)
  victory-duration-seconds: 25
  # Force storm downfall weather during combat (set false for clear weather)
  storm-weather: true
  # Dormant preparation countdown in seconds before boss awakens and combat begins
  awakening-seconds: 45
  # Legacy arrival/abandonment settings are superseded by the 30-minute combat inactivity limit.
  # Ominous buildup BGM played during the dormant countdown before combat begins
  awakening-bgm: "coresuite:boss.awakening"
  awakening-bgm-duration-seconds: 45
  # Allow placing/breaking utility blocks (Ender Chests, Shulker Boxes, Crafting Tables, etc.) mid-fight
  allow-utility-blocks: true
  # Prevent players inside the boss arena from sleeping in beds mid-fight
  prevent-sleeping: true
  # Prevent minions and bosses from combusting in daylight if daytime arrives
  prevent-daylight-combustion: true
  # Minimum online players required to summon a boss with a totem (default 1 for solo/duo)
  totem-min-players: 1
  # 72-point 4-tier vertical barrier (Y to Y+4.5)
  boundary-points: 72
  boundary-tiers: 4
  boundary-vertical-span: 4.5
  ambient-particles: true

  # Arena Lockdown & Fog Gate
  lockdown:
    enabled: true
    prep-grace-seconds: 45
    blocked-commands:
      - "spawn"
      - "home"
      - "tpa"
      - "tpahere"
      - "tpaccept"
      - "warp"
      - "back"
      - "hub"

# ------------------------------------------------------------------------------
# Combat Engine Settings
# ------------------------------------------------------------------------------
balance:
  # Rotate sustained boss focus in group fights so one player cannot absorb all the pressure.
  target-focus-seconds: 12
  # Count nearby participants active within this window, not everyone online.
  adaptive-scaling: true
  solo-health-multiplier: 0.60
  health-per-extra-player: 0.50
  activity-window-seconds: 60
  scaling-step-seconds: 5
  # Total healing across the entire encounter, including all phases.
  maximum-healing-fraction: 1.0
  # Boss outgoing damage is intentionally threatening: survival requires armour, food,
  # potions and reacting to telegraphs. It scales gently for larger active raid groups.
  solo-damage-multiplier: 0.80
  damage-per-extra-player: 0.04
  maximum-damage-multiplier: 1.15

# A player qualifies through damage or three useful combat actions: tanking boss/minion hits,
# performing a counter (Water/Night Vision), or helping remove minions. These defaults also apply
# to older world-bosses.yml files that do not yet contain this section.
rewards:
  # Combined shard payout is capped after bonuses: MVP 6, ranks 2–3 4, others 2.
  dynamic:
    # Up to +25% for peak encounter size and +25% for damage/support effort.
    # Cash above the entry-fee allowance and shards scale; guaranteed keys do not multiply.
    enabled: true
  participation:
    minimum-damage: 20.0
    minimum-contribution: 3

combat:
  # Attack charge threshold (below this, strikes land as glancing hits with scaled damage)
  attack-cooldown-threshold: 0.85
  # Glancing damage factor when below threshold (0.30 = deals 30% damage smoothly)
  glancing-damage-factor: 0.30
  # Hunter's Rhythm (Combo streak system on fully charged hits)
  combo:
    enabled: true
    max-combo: 5
    bonus-damage-per-combo: 0.05
    combo-timeout-seconds: 4
  # Apply deflection to boss minions as well
  deflect-minions: true

# ------------------------------------------------------------------------------
# Automated Scheduled Spawner
# ------------------------------------------------------------------------------
scheduler:
  enabled: true
  # Interval in seconds between wild boss spawns (e.g. 14400 = 4 hours)
  interval-seconds: 14400
  # Minimum online players required for a scheduled spawn to occur
  min-players: 1
  # Broadcast warning checkpoints in seconds before spawn
  broadcast-warnings: [1800, 900, 300, 60]
  # Worlds where wild bosses are allowed to spawn
  allowed-worlds:
    - "world"
  # Maximum search distance from world spawn (X/Z coordinates between -5000 and +5000)
  spawn-radius: 5000
  retry-seconds: 300
  search-attempts: 32
  search-timeout-seconds: 45
  # Only a verified safe location may be used when no preferred biome is found.
  allow-biome-fallback: true
  # Minimum search distance from world spawn (prevents boss from spawning in hub / claims / (0,0))
  min-spawn-distance: 800

# ------------------------------------------------------------------------------
# Garrick the Hunter (NPC Pity-Exchange System)
# ------------------------------------------------------------------------------
