# ------------------------------------------------------------------------------
# BOSS 1: VALERIUS, THE ASHEN VANGUARD
# ------------------------------------------------------------------------------
valerius:
  display-name: "&c&lValerius, The Ashen Vanguard"
  base-entity: "WITHER_SKELETON"
  scale: 1.35
  max-health: 1200.0
  melee-damage: 14.0
  movement-speed: 0.28
  biomes:
    - "BADLANDS"
    - "ERODED_BADLANDS"
    - "WOODED_BADLANDS"
    - "DESERT"
  lore:
    - "&7Valerius was the grand forgemaster of a lost desert empire,"
    - "&7ultimately sealed within his own masterpiece."
    - "&7Tempered in deep magma, his armor laughs at swords."
    - "&7Yet, when searing metal is kissed by a &b&nsudden torrential chill&7,"
    - "&7the rigid shell forgets its strength."
    - "&7Only the &e&nblunt tools of the deep earth&7 can shatter what remains."
  
  bgm: "coresuite:boss.valerius"
  bgm-duration-seconds: 375
  bgm-p1: "coresuite:boss.valerius.p1"
  bgm-p1-duration-seconds: 200
  bgm-p2: "coresuite:boss.valerius.p2"
  bgm-p2-duration-seconds: 375
  bgm-p3: "coresuite:boss.valerius.p3"
  bgm-p3-duration-seconds: 165

  combat:
    ashen-slam:
      cooldown-seconds: 8
      radius: 5.0
      damage: 14.0
      knockback: 1.2
      fire-seconds: 4
    caldera-mortar:
      cooldown-seconds: 6
      min-range: 7.0
      damage: 12.0
      splash-radius: 4.0
      wither-seconds: 5
    searing-siphon:
      interval-seconds: 6
      heal-per-player: 5.0
      drain-damage: 2.0
      max-heal-per-pulse: 15.0
    volcanic-geyser:
      cooldown-seconds: 10
      damage: 16.0
      telegraph-ticks: 30
      knockup: 1.1
    magma-rush:
      cooldown-seconds: 12
      speed: 1.6
      damage: 10.0
    cataclysmic-supernova:
      cooldown-seconds: 24
      telegraph-ticks: 40
      radius: 12.0
      damage: 24.0

  # Cryptic Weakness Mechanics
  weakness:
    sword-damage-multiplier: 0.70   # 30% damage reduction from blades & bows (balanced)
    quenched-duration-seconds: 12   # Hit with Splash Potion of Water
    pickaxe-damage-multiplier: 2.50 # +150% bonus damage from Pickaxes (natively, +250% when Quenched)
  
  # Anti-Cheese Punishments
  anti-cheese:
    pillaring-y-threshold: 4.0      # If player is 4+ blocks higher
    gravity-tether-slowness-duration: 4
    burrow-shockwave-radius: 5.0
    burrow-shockwave-damage: 12.0
    kiting-distance-threshold: 22.0
  
  # Combat Phases
  phases:
    phase-1:
      health-percent-min: 60.0
      bossbar-color: "BLUE"
      domain-effect: "CINDERS"
      hunger-level: 1
      blindness-interval-ticks: 400
    phase-2:
      health-percent-min: 20.0
      bossbar-color: "YELLOW"
      domain-effect: "MELTDOWN"
      ground-fire: true
      vaporize-water: true
      wither-level: 1
    phase-3:
      health-percent-min: 0.0
      bossbar-color: "RED"
      domain-effect: "ASH_VOID"
      attack-speed-multiplier: 2.5
      defense-multiplier: 0.0

  # Rewards
  loot:
    rank-1:
      currency: 25000
      shards: 4
      commands:
        - "crates key give %player% Uncommon 1"
    rank-2-3:
      currency: 15000
      shards: 2
      commands:
        - "crates key give %player% Common 1"
    participation:
      currency: 5000
      shards: 1
    rare-drops:
      crate-key-chance: 8.0
      crate-key-command: "crates key give %player% enchanter 1"
      signature-weapon-chance: 4.0

