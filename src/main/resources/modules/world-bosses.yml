    axe-damage-multiplier: 2.00     # Axes deal double damage
    fire-silence-seconds: 6         # Fire halts minion summon & soil regen
    arrow-damage-multiplier: 0.50   # Arrows deal reduced damage; never heal the boss

  anti-cheese:
    anti-pillar-fangs-count: 6
    fang-damage: 8.0

  phases:
