clues:
  2:
    title: "&b&lThe Frozen Grave"
    author: "&8Captain Black-Iron"
    token-name: "&b&lClue 2 &8— &3The Frozen Grave"
    token-lore:
      - "&7The simpletons of this frozen cradle"
      - "&7whispered dark tales..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&1&lTHE FROZEN CRADLE\n\n&0Listen closely, ye landlubbers, for my time grows short and the frost bites deep. My final, cursed voyage did not begin on the salted seas, but at the very anchor of this world..."
      - "&0Driven mad by the gold sickness, I fled that central nexus, turning my back on the warm winds. I marched relentlessly into the biting gale until the rain turned to ash and the green earth surrendered to a blanket of blinding, endless white."
      - "&0I sought refuge among the peaceful, large-nosed simpletons, the very first of their kind to brave the frozen wastes. They huddle by hearths of spruce, wrapped in thick furs, watched over by a silent, lumbering giant born of iron and carved pumpkin."
      - "&8&lSEEK THE SPIRE\n\n&0Seek the settlement where the rivers turn to glass and the crops sleep under the snow. But keep yer shovels sheathed, for I did not bury my prize in the frozen mud!"
      - "&0Cast yer eyes upward instead. Seek the towering wooden spire that houses the brass gong—the very chime that warns the weak of the wandering dead. Climb into the drafty rafters where the cold wind howls, for my first secret is stashed high above, hidden in the shadows of the bell itself."
  
  3:
    title: "&3&lThe Traitor's Confession"
    author: "&8Loyal Crewmate"
    token-name: "&3&lClue 3 &8— &bThe Traitor's Confession"
    token-lore:
      - "&7If ye are reading this, the sinking"
      - "&7snow has finally taken me..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&3&lTHE GLASS FOREST\n\n&0The simpletons of this frozen cradle whispered dark tales over their spruce fires. They spoke of a jagged graveyard not far from here, where the earth bares its frozen teeth to the sky."
      - "&0A forest of monumental ice needles, they called it, shadowed by a dark wooden keep where grey-skinned marauders stand watch with loaded crossbows."
      - "&0The villagers warned me that any soul who wanders into that towering glass forest is swallowed by the cold, never to return.\n\nBut a captain does not abandon his crew. I had heard rumors that my scattered men had fled toward that very outpost."
      - "&0I ventured into the howling winds, hunting for them among the frozen spires.\n\n&b&lSeek the king of these icy spears&0—find the absolute tallest needle of packed ice piercing the heavens, looming near the raiders' watchful tower."
      - "&c&lFINAL WARNING\n\n&0Heed my final warning, ye foolish treasure hunters: &cBIND YER FEET IN THICK LEATHER!&0 The chill here is unnatural, and the ground itself is a treacherous liar."
      - "&0If ye are brave enough to step into the sinking snow behind the tallest pillar, plunge beneath the false frost. I could not save my men, but from the icy grip of their remains, I pried a frostbitten journal written by one of my loyal crewmates."

  4:
    title: "&6&lThe Last Campfire"
    author: "&8Traitorous Partner"
    token-name: "&6&lClue 4 &8— &eThe Last Campfire"
    token-lore:
      - "&7The gateway shattered to pieces the"
      - "&7moment I crossed the threshold..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&c&lTHE SINKING SNOW\n\n&0If ye are reading this, the sinking snow has finally taken me. I confess my sins to the ice. I saw the Captain’s ledger. I knew where the grand booty was hidden."
      - "&0I made a plan to take it all, but the others caught me slipping the map into my coat. We crossed blades in the dark of the outpost... I had to silence them. All of them. I left their blood in the snow to save my own skin."
      - "&0I fled these cursed ice needles, looking for the high mountain route. This freezing expanse was my final view, but it wasn't supposed to be my grave!"
      - "&0I was supposed to meet my partner in crime far from here, high upon the peaks where the mountain wears a crown of &dfalling pink petals&0 and the trees bloom like a blushing dawn."
      - "&0But the coward didn't wait for me. He sent word that he found an ancient, shattered gateway in that pink grove—a ruined threshold of weeping black stone and molten rock. He sparked the dark frame and fled into the fiery underworld..."
      - "&0Follow him, if ye dare. Climb out of the ice and seek the &dcanopy of pink petals&0. Find the ruined gateway that bleeds purple tears. Whatever he left behind is stashed inside the gilded box, half-buried in the netherrack and ash."

  5:
    title: "&7&lThe Iron-Shaper"
    author: "&8Hunted Pirate"
    token-name: "&7&lClue 5 &8— &8The Iron-Shaper"
    token-lore:
      - "&7I walked until my boots wore thin"
      - "&7and my mind began to fray..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&2&lTHE GIANT'S SHADOW\n\n&0The gateway shattered to pieces the moment I crossed the threshold. The purple flames died, turning to cold, dead glass. I left that back-stabbing fool behind to freeze in the ice, and good riddance."
      - "&0Knowing I was being hunted, I turned my compass South and fled from those falling pink petals, desperate for a hidden refuge. I walked for what felt like days, crossing strange lands until the sun was completely blotted out by a forest of &2ancient, towering giants&0."
      - "&0The tree trunks here are thicker than a galleon's hull, stretching so high they pierce the sky itself.\n\nI made camp at the base of one of these massive wooden titans to rest my weary bones."
      - "&0But a shadow moved in the dark, and a twig snapped. I am not alone. I fled in such a panic that I dropped this very journal, and worse—I forgot to smother my flames."
      - "&0I only pray the glowing embers of my campfire do not catch the moss and turn these magnificent giants to ash.\n\n&6If ye are reading this, ye have tracked me well. Look to the smoke. The next piece of the map is hidden right where I sat, warming my treacherous hands."

  6:
    title: "&9&lThe Stormbringer"
    author: "&8Villager Survivor"
    token-name: "&9&lClue 6 &8— &1The Stormbringer"
    token-lore:
      - "&7We thought the high mountain stone"
      - "&7could protect us..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&7&lTHE IRON-SHAPER\n\n&0I walked until my boots wore thin and my mind began to fray. I wandered in circles, the towering trees mocking my exhaustion. At one point, I swore I saw the falling pink petals of the mountain grove again..."
      - "&0But the earth finally shifted upward, and I dragged my weak, starving body higher into the jagged peaks.\n\nAt long last, I found sanctuary. A hidden settlement clinging to the high hills, nestled deep in a grassy valley between towering, snow-capped mountains."
      - "&0The locals took pity on me. I was brought to the home of a master weaponsmith—a scarred, heavy-handed man named Balkor the Iron-shaper.\n\nTo pay for my refuge, I offered him a handful of strange, glowing stones I had pilfered from the Captain’s deep vault."
      - "&0He knew exactly what they were.\n\nBalkor locked himself in his stone forge. For three days and three nights, the sparks flew, and the deafening ring of his hammer echoed through the mountain valley."
      - "&0It was magnificent. The three prongs hummed with the raw power of the ocean, crackling with a terrifying energy.\n\nHe locked the weapon, along with the rest of my stolen bounty, into a heavy crate."
      - "&c&lTHE CURSE\n\n&0But... wait. There is a shadow passing by the window glass. I hear the unmistakable clatter of old bones and the terrifying hiss of a lit powder keg. The Captain's curse has tracked me down."
      - "&0The wooden door is splintering open, I must hide the crate beneath the grindst—\n\n&8&o[The writing suddenly devolves into frantic scribbles, dark ink splatters, and deep tears in the parchment, ending abruptly as if the author was violently dragged away.]"

  7:
    title: "&5&lThe Dungeon Master"
    author: "&8The Savior Pirate"
    token-name: "&5&lClue 7 &8— &dThe Dungeon Master"
    token-lore:
      - "&7The air on the other side of the rift"
      - "&7was heavy, choking me..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&9&lTHE STORMBRINGER\n\n&0We thought the high mountain stone could protect us. We were fools, blinded by the peace of our green valleys. I do not know how they found us through the mist, but hell followed those monsters to our gates."
      - "&0It was a slaughter unlike any other—our usual grey-skinned tormentors had allied with rotting, barnacle-covered pirates born of the deep sea.\n\nThey came with twisted technology and black magic."
      - "&0Our stone walls crumbled, and one by one, the cries of my brothers and sisters were snuffed out. I lay bleeding in the trampled mud, clutching a broken talisman, waiting for the cold embrace of death to take me.\n\n&1And then... the sky tore open."
      - "&0A suffocating silence fell over the valley, followed by a crack of thunder that rattled our very souls. Above the burning ruins, a solitary figure rose into the howling gale, clutching Balkor’s masterpiece—the three-pronged relic crackling with blue, untamed fury."
      - "&1'Oto-kura... thalass'vor... vail-en khor! Surge, you weeping deep, and wash the crimson from the stone!'\n\n&0The driving rain twisted and swelled, answering his call, rising from the earth into the shape of a colossal, wrathful titan of pure water and vengeance."
      - "&0The village was saved, but my vision was fading into blackness. Through the sheets of stinging rain and mist, I saw someone approach the savior.\n\nIt was the &5Dungeon Master&0—the outcast our village had banished to the dark abysses years ago."
      - "&0As my eyes closed for the last time, I heard their hurried, desperate words. They spoke of the relic's unimaginable power, of needing it 'contained,' and whispered about hiding the 'keys' on the other side of the rift. Then, they stepped into the dark..."

  8:
    title: "&0&lThe Abyss"
    author: "&8The Savior Pirate"
    token-name: "&0&lClue 8 &8— &8The Abyss"
    token-lore:
      - "&7We moved through the suffocating darkness"
      - "&7of the ruined city..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&5&lTHE DUNGEON MASTER\n\n&0The air on the other side of the rift was heavy, choking me with the scent of old dust and ozone. We stepped out of the portal not into a cavern, but into a sprawling, subterranean graveyard."
      - "&0It was a ruined city of &8deepslate&0, overgrown with a sickening, dark alien growth that pulsed with a faint, heartbeat-like glow.\n\nI gripped the trident tightly, its magic sputtering and cold in my hands."
      - "&0'I am the Dungeon Master,' he whispered. 'I was once a brother to those villagers above. And this place... this was once our true home. A great civilization. But my arrogance, my desperate experiments to control the dark magic of the deep... it brought the curse that consumed us all.'"
      - "&0'Because the earth shook when you raised that relic,' he replied, pointing a trembling finger at the trident. 'It was reacting to this abyss. The weapon is rejecting you, pirate. It knows the greed in your heart.'"
      - "&0'But your blast of raw power has consequences. It tore the fabric of this cavern and created powerful, violent anomalies. I have contained this one within this iron crate—a cage of infinite monstrosities—but the iron is groaning. It will not hold the power for long.'"
      - "&0'We must leave now. The route to the vault is treacherous. We must navigate through the deep caverns, past a hidden subterranean tower where those grey-skinned bandits run their dark patrols. But listen to me, pirate... watch where you step.'"
      - "&c'Whatever you do, you must not make a loud noise down here. If the ground shrieks... he will listen. And if he wakes...'"

  9:
    title: "&c&lThe Betrayal"
    author: "&8The Savior Pirate"
    token-name: "&c&lClue 9 &8— &4The Betrayal"
    token-lore:
      - "&7Under the cover of night, I scaled"
      - "&7the wooden tower..."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&0&lTHE ABYSS\n\n&0We moved through the suffocating darkness of the ruined city, placing our feet with agonizing care. Every breath felt like a crime against the silence. It was then, in the pitch black, that the Dungeon Master confessed his deception."
      - "&0‘I did not tell you the whole truth, pirate,’ he whispered, his eyes wide with guilt. ‘These keys... they are not just iron and gold. They are forged with the raw, untamed magic of another world. They hold the power to bend reality itself.’"
      - "&0‘I watched through my scrying crystal as the raiders snatched the lesser keys and carried them off to their fortified tower. I lied to you because I needed your strength—the power of that trident—to get them back. But the most powerful key of all... it is still hidden here in this city.’"
      - "&0Before I could raise my voice in anger, a horrific sound shattered the silence.\n\nThe iron crate in my hands—the one containing the chaotic anomaly—began to violently shake. A deafening, mechanical screech tore out from the metal box, echoing endlessly against the cavern walls."
      - "&0We froze. The dark, alien growths all around us began to light up, pulsing one by one in a sickening, rhythmic wave of blue light. The ground violently shook. The Dungeon Master fell to his knees in pure terror as a towering, eyeless nightmare of bone and void dragged itself out from the solid stone."
      - "&0With a look of absolute resolve, he shoved a leather-bound diary, a stack of notes, and a crumpled map into my chest. ‘Go!’ he screamed, drawing a fragile iron sword. ‘I will hold him back! Escape this place!’"
      - "&0I ran. I didn't look back. I sprinted blindly through the dark... As I scrambled up the deepslate tunnels, my boot violently struck something hard, sending me sprawling into the dirt. I cursed, feeling blindly in the pitch black, and my fingers closed around cold, heavy metal thrumming with raw mana."
      - "&0It was the &eMaster Key&0. The Dungeon Master hadn't lost the most powerful one—he had hidden it here on the escape path, knowing I would run."
      - "&0Driven by the Dungeon Master's final wish, I tracked the raiders to their towering wooden fortress. But as I crept through the tall grass, my heart sank. A dark bargain was being struck by torchlight. The grey-skinned bandits and the barnacle-crusted pirates stood at the base of the tower, dividing the Dungeon Master's stolen keys!"
      - "&0I sit here in the dark, holding the Master Key. The burden is now mine. I will storm this wooden tower tonight and take back what the bandits hold. Then, I will build a boat, and I will hunt those pirates across the ocean to the ends of the earth. I will reunite the keys, no matter the cost."

  10:
    title: "&a&lThe Sanctuary"
    author: "&8The Savior Pirate"
    token-name: "&a&lClue 10 &8— &2The Sanctuary"
    token-lore:
      - "&7To whoever finds this weathered journal..."
      - "&7my journey ends here."
      - ""
      - "&e&lRIGHT-CLICK &7to read the story."
      - "&8Keep this safe for the final verification!"
    pages:
      - "&c&lTHE BETRAYAL\n\n&0Under the cover of night, I scaled the wooden tower, slipping past the sleeping bandits to reclaim the first stolen key. With half the burden secured, I chased the pirate lord’s black sails and snuck aboard his ship, blending in among his filthy, rotting crew."
      - "&0I bided my time, waiting for the crew to break their watch. I slipped into the captain's quarters, eyeing a heavily guarded lockbox. But the moment I reached for it, a cold flintlock barrel pressed against the back of my head. The captain had suspected me from the start. The box was a decoy."
      - "&0I was dragged out onto the rain-slicked deck, surrounded by a circle of laughing, cutthroat pirates. Backed against the railing, I summoned the Dungeon Master’s relic—the Trident—praying for the blue lightning to save me again. But the metal remained cold and dead in my hands. It refused to answer."
      - "&0The crew roared with laughter. But then, I remembered the Dungeon Master’s words in the abyss: &8&o*The weapon rejects the greedy heart.*\n\n&0I dropped to my knees, offering the dead relic forward. 'I am but a humble pirate looking for a crew!' I lied, bowing my head."
      - "&0Blinded by his own ego, the pirate lord snatched the Trident from my hands. He raised it to the sky with a triumphant roar.\n\n&cHe sealed his own doom."
      - "&0The moment his wicked hands gripped the handle, the sky turned pitch black. A blinding flash of lightning struck the mast. Then, a voice erupted from the crashing waves below—a booming, ancient roar that shook the very planks beneath our feet.\n\n&1'YOU DARE WIELD THIS HOLY POWER WITH YOUR ILL INTENT? YOU SHALL MEET THE OCEAN'S WRATH!'"
      - "&0The sea violently exploded upward. A colossal wave crashed down, snapping the galleon in half like a dry twig. The ocean swallowed the ship whole. In the chaotic, swirling maelstrom, I ripped the real key from the drowning captain’s belt and threw myself into the raging waters."
      - "&0I washed ashore hours later, coughing up seawater, clutching all the keys. But the ocean had marked me. I carry a curse now—if I ever set sail upon the sea again, the depths will pull me under."
      - "&0My pirating days are over. I walked inland, following the Dungeon Master's final map. I passed through a quiet coastal village where the pulse of a strange, blue conduit beat like the very heart of the sea. I kept walking, leaving the water behind, climbing higher and higher until the ocean was just a memory."
      - "&2&lTHE SANCTUARY\n\n&0I have found the sanctuary. An island of earth floating above the world, high in the clouds, resting peacefully under the shade of massive trees. I leave the relic, the keys, and all my worldly wealth here. Whoever finds this... use it better than we did."
      - "&0To whoever finds this weathered journal... my journey ends here. The curse of the Trident runs deep in my bones, and the cold grip of the ocean pulls at my weary soul. I can run no further."
      - "&0I did not bring the treasure to this exact spot. Instead, I leave you my most precious navigational tool. Inside this very box lies a heavy, enchanted &ecompass&0. Its needle does not point North; it is magnetically bound to the final sanctuary built by the Dungeon Master himself—a hidden vault high above the world, protected by the lingering, ancient power of the ocean."
      - "&bFollow the needle. When you reach the sanctuary, walk to the absolute center of the ruins. The grand booty awaits you there. The relic, the keys, the wealth... it is all yours to claim."
      - "&0I have lived a life of unchecked greed and bloodshed. I betrayed my crew, stole what was not mine, and brought ruin to innocent shores. Let this act—surrendering the greatest treasure this world has ever known to a braver soul—be my final voyage. Let it be the one good deed that washes away my past sins.\n\n&8The storm in my mind is finally quiet. I now rest."
