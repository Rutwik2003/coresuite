# ============================================================
# CoreSuite - ClearLag Module Configuration
# ============================================================

# Prefix for messages
prefix: "<##66EF8B><b>MeerMC » &r"

# Cleanup interval in seconds (default: 8 minutes = 480 seconds)
interval: 480

# Warning times in seconds remaining
# E.g. 180 means it warns when 3 minutes remain
warnings:
  - 180
  - 120
  - 60
  - 30
  - 5
  - 4
  - 3
  - 2
  - 1

clear-entities:
  - "DROPPED_ITEM"
  - "ARROW"

messages:
  warning-message: "&eGround items will be cleared in {time}."
  cleared-message: "&aCleared {count} entities."
