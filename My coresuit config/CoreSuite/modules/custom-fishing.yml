    cost: 50000
    level-required: 15
  '5':
    cost: 75000
    level-required: 20
  '6':
    cost: 100000
    level-required: 30
  '7':
    cost: 150000
    level-required: 40
  '8':
    cost: 200000
    level-required: 50
  '9':
    cost: 300000
    level-required: 65
  '10':
    cost: 500000
    level-required: 80

# ═══════════════════════════════════════════════════
# TOURNAMENT
# ═══════════════════════════════════════════════════
# Settings for periodic fishing tournaments.


# ==========================================
#              TOURNAMENTS
# ==========================================
# Weekly/Daily automated fishing competitions.
tournament:
  enabled: true
  reset-day: MONDAY
  reset-hour: 0
  min-participants: 3
  prizes:
    '1': 50000
    '2': 25000
    '3': 10000
  prize-commands:
    '1': []
    '2': []
    '3': []

