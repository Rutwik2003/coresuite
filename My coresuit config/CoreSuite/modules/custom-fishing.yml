    material: GOLD_NUGGET
    price: 95000
    daily-limit: 5
    casts: 10
    catch-chance-bonus: 0.0
    weight-bonus: 0.25
    lore:
      - '&7A shiny lure that attracts'
      - '&7heavier fish.'
  tide_essence:
    name: "Tide's Blessing"
    material: HEART_OF_THE_SEA
    price: 250000
    daily-limit: 5
    time: 180
    catch-chance-bonus: 0.35
    weight-bonus: 0.0
    lore:
      - '&7A magical essence that significantly'
      - '&7increases catch rates for a limited time.'
  mythic_chum:
    name: 'Mythical Chum'
    material: FERMENTED_SPIDER_EYE
    price: 500000
    daily-limit: 5
    time: 300
    catch-chance-bonus: 0.55
    weight-bonus: 0.5
    rarity-bias: epic
    lore:
      - '&7A foul-smelling bait that attracts'
      - '&7the rarest and heaviest of fish.'

# ═══════════════════════════════════════════════════
# REWARDS
# ═══════════════════════════════════════════════════
# Fishing rewards configuration.


# ==========================================
#               TREASURE REWARDS
# ==========================================
# Rare items, keys, and commands executed when players fish up treasure.
# Format: <weight>|<Rarity>|<Display Name>|<Sound>|<Command (without /)>
rewards:
  treasure:
    chance: 0.05
    items:
      - material: DIAMOND
        amount: 1
      - material: GOLD_INGOT
        amount: 3
  junk:
    chance: 0.15
    items:
      - material: LEATHER_BOOTS
        amount: 1
      - material: STICK
        amount: 1

