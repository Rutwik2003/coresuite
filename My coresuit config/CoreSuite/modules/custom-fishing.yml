# ═══════════════════════════════════════════════════
# CORE SUITE - CUSTOM FISHING MODULE
# ═══════════════════════════════════════════════════
# This configuration file manages all settings related
# to the custom fishing system.
# ═══════════════════════════════════════════════════

# Version of the configuration file (do not change)
config-version: 2

# Global prefix used for chat messages
# ==========================================
#         CORE SUITE - CUSTOM FISHING
# ==========================================
# The prefix shown before all fishing chat messages.
prefix: '&8[&b&lFishing&8] &r'

# ═══════════════════════════════════════════════════
# STREAK & FATIGUE
# ═══════════════════════════════════════════════════
# Settings for the catch streak and fishing fatigue
# mechanics.

# Time in seconds before a fishing streak expires

# ==========================================
#                STREAKS
# ==========================================
# Time in seconds before your fishing combo streak resets.
streak-timeout: 45

# Multiplier caps for catch rewards based on streak.
streak:
  # Maximum streak multiplier
  multiplier-cap: 5.0


# ==========================================
#                FATIGUE SYSTEM
# ==========================================
# Controls how fast players get tired and stop gaining XP.
fatigue:
  # Time in minutes it takes to fully recover from fatigue
  recovery-time-minutes: 60
  # The threshold value where fatigue starts affecting catches
  threshold: 75
  # Message shown when the player is getting fatigued
  message: '&c&oGetting tired...'

# ═══════════════════════════════════════════════════
# LEGENDARY QUEST
# ═══════════════════════════════════════════════════
# Settings for the legendary quest system.


# ==========================================
#            ANCIENT ANGLER QUEST
# ==========================================
# Settings for the Tidecaller's Pearl and the hidden legendary NPC.
legendary-quest:
  # Base chance to drop a legendary map
  map-drop-chance: 0.0002
  # Maximum chance to drop a legendary map
  map-drop-chance-cap: 0.001
  # The number of casts before pity threshold kicks in
  pity-threshold: 2500
  # Time in seconds before an idle quest NPC despawns
  npc-idle-timeout-seconds: 300
  # Maximum distance in blocks a player can be from the NPC
  npc-max-distance-blocks: 50
  # Base chance bonus for the Tireless Caster enchant
  tireless-caster-base-chance: 1.0
  # Decay rate for the Tireless Caster enchant bonus
  tireless-caster-decay: 0.5
  # Base money penalty for failing a quest
  fail-penalty-base: 10000
  # Multiplier applied to the penalty for consecutive failures
  fail-penalty-multiplier: 2.0
  # Maximum money penalty for failing
  fail-penalty-cap: 500000
  # Whether players can go into debt from failing (true/false)
  fail-penalty-allow-debt: true
  # Cost to perform a sacrifice
  sacrifice-cost: 25000
  # Minimum value of fish to seize if sacrifice is skipped
  sacrifice-no-fish-seizure: 50000
  # Weight for pulling a legendary fish during sacrifice
  sacrifice-legendary-weight: 50
  # Weight for pulling an epic fish during sacrifice
  sacrifice-epic-weight: 30
  # Weight for pulling a rare fish during sacrifice
  sacrifice-rare-weight: 20
  # Broadcast a message server-wide on the first NPC summon
  broadcast-on-first-summon: true
  # Sound played during the broadcast
  broadcast-sound: ENTITY_WITHER_SPAWN
  # Volume of the broadcast sound
  broadcast-sound-volume: 0.5
  # Pitch of the broadcast sound
  broadcast-sound-pitch: 0.7
  # Timeout in seconds for chat interactions with the NPC
  chat-timeout-seconds: 120
  # Skin value data for the NPC
  npc-skin-value: 
  # Skin signature data for the NPC
  npc-skin-signature: 

# ═══════════════════════════════════════════════════
# ENCHANTS
# ═══════════════════════════════════════════════════
# Configuration for custom fishing rod enchantments.


# ==========================================
#          FISHING ENCHANTMENTS
# ==========================================
# Custom enchants available in the /fish shop.
enchants:
  lure_of_the_deep:
    name: '&bLure of the Deep'
    desc: 'Increases chance of catching fish.'
    base-price: 100000
    price-multiplier: 1.5
    max-level: 3
    xp-required: 45
    catches-required: 30
  heavyweight:
    name: '&cHeavyweight'
    desc: 'Increases the weight of fish caught.'
    base-price: 250000
    price-multiplier: 1.8
    max-level: 5
    xp-required: 45
    catches-required: 100
  double_hook:
    name: '&aDouble Hook'
    desc: 'Chance to catch two fish at once.'
    base-price: 500000
    price-multiplier: 2.0
    max-level: 3
    xp-required: 60
    catches-required: 150
  treasure_hunter:
    name: '&6Treasure Hunter'
    desc: 'Increases chance to find rare rewards.'
    base-price: 500000
    price-multiplier: 2.5
    max-level: 3
    xp-required: 60
    catches-required: 175
  tireless_caster:
    name: '&aTireless Caster'
    desc: 'Reduces fishing fatigue generation.'
    base-price: 500000
    price-multiplier: 2.0
    max-level: 3
    xp-required: 150
    catches-required: 500

# ═══════════════════════════════════════════════════
# MESSAGES
# ═══════════════════════════════════════════════════
# Chat messages related to fishing.


# ==========================================
#               MESSAGES
# ==========================================
# Customizable messages for the module.
messages:
  streak-message: '&7Streak: &b{streak}x&8/&7{cap} &8- &7Angler Lv.&b{level}'
  junk-catch-message: '&7You caught {name}&7... not exactly treasure.'
  level-up: '&a&lLEVEL UP! &7You are now Angler Level &b{level}&7!'

# ═══════════════════════════════════════════════════
# POND EVENT
# ═══════════════════════════════════════════════════
# Configuration for the Legendary Fishing Pond event.


# ==========================================
#           LEGENDARY POND EVENT
# ==========================================
# Periodic world events where a pond spawns giving massive bonuses.
pond-event:
  enabled: true
  interval-minutes: 60
  fatigue-heal-amount: 3.0
  forming-minutes: 10
  duration-minutes: 10
  forming-sound: BLOCK_NOTE_BLOCK_CHIME
  start-sound: UI_TOAST_CHALLENGE_COMPLETE
  min-players: 2
  spawn-radius: 8000
  radius: 5.0
  reward-multiplier: 2.0
  weight-multiplier: 2.0
  enter-message: '&a✦ You entered the Legendary Fishing Pond! Cast your rod here for bonus rewards!'
  leave-message: '&7✦ You left the Legendary Fishing Pond area.'

# ═══════════════════════════════════════════════════
# BAG PAGES
# ═══════════════════════════════════════════════════
# Configuration for fishing bag pages and their unlock
# requirements (cost and required level).


# ==========================================
#               FISH BAG
# ==========================================
