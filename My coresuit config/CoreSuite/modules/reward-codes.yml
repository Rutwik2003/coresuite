# ============================================================
# CoreSuite - RewardCodes Module Configuration
# ============================================================

# The 6-character code players can redeem
code: "M7X2Q9"

# Money reward to give
money-reward: 50000

# Commands to execute from console when a player redeems the code
# Use %player% for the player's name
commands:
  - "uc give key 1 %player%"
  - "crate key give %player% rare 1"
  - "crate key give %player% uncommon 2"
  - "crate key give %player% common 5"

# Messages to send to the player when they redeem the code
success-messages:
  - "&a&lSUCCESS! &fYou have redeemed your reward!"
  - "&7- &f$50,000"
  - "&7- &f1x UltraCosmetics Key"
  - "&7- &f1x Rare Crate Key"
  - "&7- &f2x Uncommon Crate Key"
  - "&7- &f5x Common Crate Key"
