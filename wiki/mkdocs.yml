site_name: CoreSuite Wiki
site_description: Setup, gameplay, configuration and operations for CoreSuite server owners.
site_url: https://rutwik2003.github.io/coresuite/
repo_url: https://github.com/Rutwik2003/coresuite
edit_uri: edit/codex/wiki/wiki/docs/
docs_dir: docs
site_dir: ../build/wiki-site
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
