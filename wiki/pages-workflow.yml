name: Publish CoreSuite Wiki
on:
  push:
    branches: [codex/wiki]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coresuite-wiki-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wiki/requirements.txt
      - run: pip install -r wiki/requirements.txt
      - run: python -m mkdocs build --strict -f wiki/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
